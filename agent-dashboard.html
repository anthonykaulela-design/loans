<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Agent Portal | Commission Metrics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; color: white; }
    .table { color: #f8fafc; }
    .table th { background-color: #0f172a; color: #94a3b8; border-color: #334155; }
    .table td { border-color: #334155; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-info">
    <div class="container">
      <span class="navbar-brand fw-bold text-dark" id="agentName">Sales Agent Portal</span>
      <button class="btn btn-outline-dark btn-sm fw-bold" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card p-3 border-start border-4 border-success">
          <span class="text-muted small">Total Earned Commission</span>
          <h3 class="fw-bold text-success mb-0" id="totalCommission">R0.00</h3>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 border-start border-4 border-primary">
          <span class="text-muted small">Approved Client Referrals</span>
          <h3 class="fw-bold text-primary mb-0" id="approvedReferrals">0</h3>
        </div>
      </div>
    </div>

    <div class="card p-4">
      <h4 class="fw-bold mb-3 text-info">Referred Borrowers & Commission Breakdowns</h4>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Borrower Name</th>
              <th>Phone</th>
              <th>Loan Status</th>
              <th>Earned Commission</th>
            </tr>
          </thead>
          <tbody id="agentTableBody">
            <tr><td colspan="4" class="text-center text-muted">Loading referrals...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('agentToken');
    if (!token) window.location.href = '/agent-login.html';

    async function loadAgentData() {
      try {
        const res = await fetch('/api/agent/my-performance', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('agentName').innerText = `Agent: ${data.agent.first_name}`;
          document.getElementById('totalCommission').innerText = `R${data.total_commission.toFixed(2)}`;
          document.getElementById('approvedReferrals').innerText = data.approved_count;

          document.getElementById('agentTableBody').innerHTML = data.referrals.map(r => `
            <tr>
              <td>${r.first_name} ${r.last_name}</td>
              <td>${r.phone}</td>
              <td><span class="badge bg-${r.loan_status === 'APPROVED' ? 'success' : 'warning'}">${r.loan_status}</span></td>
              <td class="fw-bold text-success">R${parseFloat(r.commission_amount || 0).toFixed(2)}</td>
            </tr>
          `).join('');
        }
      } catch (err) { console.error('Error loading agent performance:', err); }
    }

    function logout() { localStorage.clear(); window.location.href = '/agent-login.html'; }
    loadAgentData();
  </script>
</body>
</html>
